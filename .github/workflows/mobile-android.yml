# Builds the Android app (mobile/) and keeps the APK as a download.
# Debug-signed: installable on company phones directly (no Play Store).
name: Mobile · Android

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: abl-translate-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
